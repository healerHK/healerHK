<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Pixel 2D AI lab banner for Thành Ý Nguyen</title>
  <desc id="desc">A dark neon pixel art AI lab with a developer, laptop, neural network, geospatial map, and research notes.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1026"/>
      <stop offset="50%" stop-color="#111742"/>
      <stop offset="100%" stop-color="#160b2f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- pixel stars -->
  <g fill="#e0f2fe" opacity="0.9">
    <rect x="58" y="42" width="6" height="6"/><rect x="150" y="78" width="4" height="4"/><rect x="258" y="38" width="5" height="5"/>
    <rect x="388" y="70" width="4" height="4"/><rect x="520" y="34" width="6" height="6"/><rect x="703" y="82" width="4" height="4"/>
    <rect x="842" y="48" width="5" height="5"/><rect x="975" y="76" width="4" height="4"/><rect x="1102" y="36" width="6" height="6"/>
    <rect x="1128" y="118" width="4" height="4"/><rect x="80" y="132" width="4" height="4"/><rect x="610" y="116" width="5" height="5"/>
  </g>

  <!-- back skyline -->
  <g opacity="0.72">
    <rect x="0" y="232" width="1200" height="8" fill="#27316f"/>
    <rect x="36" y="176" width="54" height="56" fill="#121a46"/><rect x="48" y="188" width="8" height="8" fill="#22d3ee"/><rect x="70" y="206" width="8" height="8" fill="#a78bfa"/>
    <rect x="114" y="142" width="74" height="90" fill="#121a46"/><rect x="132" y="160" width="10" height="10" fill="#38bdf8"/><rect x="158" y="188" width="10" height="10" fill="#f0abfc"/>
    <rect x="210" y="196" width="66" height="36" fill="#121a46"/><rect x="230" y="210" width="8" height="8" fill="#67e8f9"/>
    <rect x="922" y="160" width="70" height="72" fill="#121a46"/><rect x="944" y="178" width="10" height="10" fill="#22d3ee"/><rect x="970" y="204" width="10" height="10" fill="#c084fc"/>
    <rect x="1016" y="128" width="96" height="104" fill="#121a46"/><rect x="1034" y="150" width="10" height="10" fill="#f472b6"/><rect x="1066" y="180" width="10" height="10" fill="#60a5fa"/><rect x="1090" y="210" width="10" height="10" fill="#34d399"/>
  </g>

  <!-- main lab panels -->
  <rect x="54" y="96" width="280" height="140" fill="#081126" stroke="#22d3ee" stroke-width="4"/>
  <rect x="66" y="108" width="256" height="116" fill="#0f1b3d"/>
  <text x="84" y="136" fill="#67e8f9" font-family="monospace" font-size="18" font-weight="700">AI SYSTEMS</text>
  <rect x="84" y="156" width="94" height="12" fill="#22d3ee"/><rect x="184" y="156" width="42" height="12" fill="#a78bfa"/><rect x="234" y="156" width="42" height="12" fill="#34d399"/>
  <rect x="84" y="184" width="156" height="10" fill="#475569"/><rect x="84" y="204" width="210" height="10" fill="#334155"/>
  <circle cx="282" cy="178" r="20" fill="#0ea5e9"/><rect x="276" y="172" width="12" height="12" fill="#e0f2fe"/>

  <rect x="866" y="92" width="286" height="148" fill="#081126" stroke="#c084fc" stroke-width="4"/>
  <rect x="878" y="104" width="262" height="124" fill="#130f2d"/>
  <text x="896" y="132" fill="#f0abfc" font-family="monospace" font-size="18" font-weight="700">RESEARCH GRAPH</text>
  <g stroke="#7dd3fc" stroke-width="4" fill="#1e293b" filter="url(#glow)">
    <line x1="936" y1="176" x2="1004" y2="152"/><line x1="1004" y1="152" x2="1066" y2="190"/><line x1="936" y1="176" x2="1014" y2="204"/>
    <rect x="926" y="166" width="20" height="20" fill="#22d3ee"/><rect x="994" y="142" width="20" height="20" fill="#a78bfa"/>
    <rect x="1056" y="180" width="20" height="20" fill="#34d399"/><rect x="1004" y="194" width="20" height="20" fill="#f472b6"/>
  </g>

  <!-- floor -->
  <rect x="0" y="240" width="1200" height="180" fill="url(#floor)"/>
  <g stroke="#1d4ed8" stroke-width="2" opacity="0.45">
    <path d="M0 300 H1200"/><path d="M0 340 H1200"/><path d="M0 380 H1200"/>
    <path d="M126 240 L40 420"/><path d="M260 240 L220 420"/><path d="M410 240 L400 420"/><path d="M560 240 L590 420"/><path d="M720 240 L790 420"/><path d="M880 240 L980 420"/><path d="M1030 240 L1160 420"/>
  </g>

  <!-- central desk -->
  <rect x="404" y="252" width="396" height="26" fill="#312e81"/>
  <rect x="430" y="278" width="344" height="18" fill="#1e1b4b"/>
  <rect x="454" y="296" width="34" height="82" fill="#1e1b4b"/><rect x="710" y="296" width="34" height="82" fill="#1e1b4b"/>
  <rect x="436" y="370" width="330" height="14" fill="#0f172a"/>

  <!-- laptop -->
  <rect x="522" y="184" width="156" height="96" fill="#020617" stroke="#38bdf8" stroke-width="4"/>
  <rect x="536" y="198" width="128" height="68" fill="#0b1224"/>
  <rect x="550" y="214" width="34" height="8" fill="#22d3ee"/><rect x="592" y="214" width="56" height="8" fill="#a78bfa"/>
  <rect x="550" y="236" width="84" height="8" fill="#34d399"/><rect x="550" y="250" width="44" height="8" fill="#f472b6"/>
  <rect x="500" y="280" width="200" height="16" fill="#64748b"/><rect x="536" y="286" width="128" height="4" fill="#cbd5e1"/>

  <!-- engineer avatar -->
  <rect x="574" y="116" width="50" height="50" fill="#f7c59f"/>
  <rect x="564" y="100" width="70" height="26" fill="#111827"/>
  <rect x="574" y="132" width="10" height="8" fill="#0f172a"/><rect x="614" y="132" width="10" height="8" fill="#0f172a"/>
  <rect x="594" y="150" width="12" height="6" fill="#9f1239"/>
  <rect x="550" y="166" width="100" height="70" fill="#2563eb"/>
  <rect x="570" y="180" width="60" height="14" fill="#22d3ee"/>
  <rect x="534" y="182" width="18" height="70" fill="#1d4ed8"/><rect x="648" y="182" width="18" height="70" fill="#1d4ed8"/>

  <!-- floating AI cube -->
  <g filter="url(#glow)">
    <rect x="700" y="92" width="78" height="78" fill="#0f172a" stroke="#22d3ee" stroke-width="4"/>
    <rect x="718" y="110" width="14" height="14" fill="#22d3ee"/><rect x="746" y="110" width="14" height="14" fill="#c084fc"/>
    <rect x="718" y="138" width="14" height="14" fill="#34d399"/><rect x="746" y="138" width="14" height="14" fill="#f472b6"/>
    <line x1="732" y1="117" x2="746" y2="117" stroke="#e0f2fe" stroke-width="4"/><line x1="725" y1="124" x2="725" y2="138" stroke="#e0f2fe" stroke-width="4"/>
    <text x="692" y="190" fill="#67e8f9" font-family="monospace" font-size="14">RAG • AGENTS • MAPS</text>
  </g>

  <!-- geospatial mini map -->
  <rect x="108" y="270" width="202" height="92" fill="#052e16" stroke="#34d399" stroke-width="4"/>
  <rect x="126" y="288" width="34" height="24" fill="#166534"/><rect x="162" y="314" width="42" height="28" fill="#15803d"/><rect x="216" y="292" width="52" height="18" fill="#65a30d"/>
  <path d="M126 344 L176 320 L224 334 L288 300" stroke="#67e8f9" stroke-width="6" fill="none"/>
  <rect x="246" y="326" width="16" height="16" fill="#facc15"/>
  <text x="126" y="256" fill="#86efac" font-family="monospace" font-size="14">POSTGIS + ML</text>

  <!-- research notes stack -->
  <rect x="890" y="274" width="196" height="120" fill="#111827" stroke="#f472b6" stroke-width="4"/>
  <rect x="906" y="292" width="164" height="12" fill="#f0abfc"/><rect x="906" y="318" width="132" height="10" fill="#475569"/>
  <rect x="906" y="340" width="154" height="10" fill="#475569"/><rect x="906" y="362" width="100" height="10" fill="#22d3ee"/>
  <text x="906" y="260" fill="#f0abfc" font-family="monospace" font-size="14">CITATION-GROUNDED</text>

  <!-- title plate -->
  <rect x="352" y="24" width="496" height="52" fill="#020617" stroke="#22d3ee" stroke-width="4"/>
  <text x="382" y="58" fill="#e0f2fe" font-family="monospace" font-size="28" font-weight="800">THÀNH Ý NGUYEN · AI ENGINEER</text>
</svg>
